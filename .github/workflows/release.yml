name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live + packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-bibtex-extra texlive-plain-generic \
            lmodern latexmk biber

      - name: Install fonts (Times New Roman + Latin Modern)
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends \
            ttf-mscorefonts-installer fonts-lmodern fonts-texgyre || true
          sudo fc-cache -f
          luaotfload-tool --update --force || true
          fc-list | grep -i "times" || true

      - name: Compile document
        run: |
          latexmk -lualatex -outdir=output main.tex

      - name: Create release archive
        run: |
          mkdir -p dist
          cp output/main.pdf dist/
          tar -czf dist/framework-source.tar.gz \
            main.tex preamble frontmatter chapters \
            bibliography figures themes docs \
            Makefile .latexmkrc README.md CHANGELOG.md LICENSE

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/main.pdf
            dist/framework-source.tar.gz
